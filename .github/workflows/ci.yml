name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iclinic
          POSTGRES_PASSWORD: iclinic
          POSTGRES_DB: iclinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iclinic -d iclinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The app reads this at import time. No model or Twilio keys are needed: the tests use a scripted model.
      DATABASE_URL: postgresql+asyncpg://iclinic:iclinic@localhost:5432/iclinic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # Unit tests only. tests/e2e needs a running server and live model keys, so it never runs in CI.
      - run: uv run pytest tests -q --ignore=tests/e2e
      # Proves every migration applies to an empty database.
      - run: uv run alembic upgrade head

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build ./backend
      - run: docker build ./frontend
