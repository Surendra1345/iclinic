[project]
name = "iclinic"
version = "0.1.0"
description = "City Care Clinic voice and web assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "docker>=7.2.0",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.29.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "twilio>=9.12.0",
    "uvicorn>=0.54.0",
    "websockets>=14.0,<17.0",
    "google-genai>=1.65.0",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
