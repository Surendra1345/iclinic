services:
  postgres:
    image: postgres:16-alpine
    container_name: iclinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iclinic
      POSTGRES_PASSWORD: iclinic
      POSTGRES_DB: iclinic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iclinic -d iclinic"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Containerized FastAPI service (optional: run with --profile full)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iclinic-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://iclinic:iclinic@postgres:5432/iclinic
      DB_ECHO: "false"
    ports:
      - "8000:8000"
    profiles:
      - full

volumes:
  postgres_data:
